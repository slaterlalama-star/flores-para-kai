<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Kai 🌹</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="intro">

    <h1 id="mensaje">
        Hoy muchas personas regalan flores.
    </h1>


    <div id="primeraPantalla" class="oculto">

        <img id="ramo" src="ramo.png" alt="Ramo">


        <h2>
            Feliz Día de la Novia, Kai.
        </h2>


        <p>
            No pude llevarte flores hoy...
            <br><br>
            pero quería regalarte unas
            <br>
            que siempre estuvieran aquí.
        </p>


        <button onclick="abrirNombre()">
            Todavía queda algo...
        </button>


    </div>

</div>




<div id="modalNombre" class="oculto">


    <div class="cajaNombre">


        <h2>
            Antes de entregarte esto...
        </h2>


        <p>
            Escribe tu nombre ❤️
        </p>


        <input id="nombreKai" placeholder="Kai">


        <button onclick="descubrir()">
            ❤️ Descubrir
        </button>


    </div>


</div>





<div id="final" class="oculto">


    <div class="rosa">
        🌹
    </div>


    <p id="mensajeFinal"></p>


</div>





<script src="script.js"></script>


</body>

</html>
